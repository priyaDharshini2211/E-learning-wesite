<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" font-family="Plus Jakarta Sans, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0fd"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
  </defs>

  <path d="M90 120C120 40 260 10 380 40C500 70 610 130 600 270C590 410 470 500 320 490C170 480 40 420 40 300C40 230 60 180 90 120Z" fill="url(#blob)"/>
  <circle cx="70" cy="460" r="10" fill="#c7d2fe"/>
  <circle cx="610" cy="60" r="8" fill="#fde68a"/>
  <circle cx="30" cy="200" r="6" fill="#a5b4fc"/>
  <path d="M560 440l8 16 16 8-16 8-8 16-8-16-16-8 16-8z" fill="#fbbf24" opacity="0.8"/>

  <!-- laptop -->
  <g filter="url(#sh)">
    <rect x="90" y="150" width="340" height="210" rx="16" fill="#1e1b4b"/>
    <rect x="102" y="162" width="316" height="186" rx="8" fill="url(#g1)"/>
    <rect x="50" y="360" width="420" height="16" rx="8" fill="#c7cbe8"/>
    <rect x="220" y="360" width="80" height="6" rx="3" fill="#a5a9d0"/>
  </g>
  <rect x="130" y="182" width="100" height="8" rx="4" fill="#fff" opacity="0.6"/>
  <rect x="130" y="198" width="60" height="8" rx="4" fill="#fff" opacity="0.35"/>
  <circle cx="260" cy="256" r="36" fill="#fff" opacity="0.96"/>
  <polygon points="248,238 248,274 280,256" fill="#4f46e5"/>
  <rect x="130" y="318" width="260" height="8" rx="4" fill="#fff" opacity="0.3"/>
  <rect x="130" y="318" width="170" height="8" rx="4" fill="#fff"/>

  <!-- books -->
  <g filter="url(#sh)">
    <rect x="490" y="344" width="120" height="32" rx="6" fill="#f59e0b"/>
    <rect x="500" y="316" width="100" height="28" rx="6" fill="#4f46e5"/>
    <rect x="486" y="290" width="110" height="26" rx="6" fill="#14b8a6"/>
  </g>
  <rect x="504" y="356" width="60" height="5" rx="2.5" fill="#fff" opacity="0.6"/>
  <rect x="514" y="327" width="40" height="5" rx="2.5" fill="#fff" opacity="0.6"/>
  <rect x="500" y="300" width="50" height="5" rx="2.5" fill="#fff" opacity="0.6"/>

  <!-- graduation cap -->
  <g filter="url(#sh)">
    <path d="M430 128v28q40 22 80 0v-28l-40 18z" fill="#312e81"/>
    <polygon points="470,90 540,115 470,140 400,115" fill="#1e1b4b"/>
    <line x1="540" y1="115" x2="540" y2="162" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="540" cy="166" r="6" fill="#fbbf24"/>
  </g>

  <!-- card: completed -->
  <g filter="url(#sh)">
    <rect x="30" y="70" width="180" height="66" rx="16" fill="#fff"/>
  </g>
  <circle cx="64" cy="103" r="16" fill="#22c55e"/>
  <path d="M56 103l6 6 11-12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="99" font-size="13" font-weight="700" fill="#1c2130">Course completed</text>
  <text x="90" y="117" font-size="11" fill="#6b7280">Full Stack Development</text>

  <!-- card: attendance -->
  <g filter="url(#sh)">
    <rect x="440" y="196" width="170" height="82" rx="16" fill="#fff"/>
  </g>
  <text x="458" y="224" font-size="11" font-weight="600" fill="#6b7280">Attendance</text>
  <text x="458" y="252" font-size="22" font-weight="800" fill="#1c2130">96%</text>
  <rect x="510" y="240" width="84" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="510" y="240" width="78" height="8" rx="4" fill="#4f46e5"/>
